; gsm2computer-managed
; Inbound GSM answers only after the hub says yes. AudioSocket is 8 kHz s16le
; over TCP to cup. A busy hub gets Hangup(17) on this channel only.
; SMS is posted twice on purpose, with the same clientId: AMI UserEvent and
; this System() call. The hub stores one of them.

[gateway-in]
exten => s,1,NoOp(gsm inbound ${CALLERID(num)})
 same => n,Set(HUB=${ENV(GSM_GATEWAY_HUB_BASE)})
 same => n,Set(ASOCK=${ENV(GSM_GATEWAY_AUDIOSOCKET)})
 same => n,Set(NUM=${CALLERID(num)})
 same => n,Set(NUM=${REPLACE(NUM,+,%2B)})
 same => n,Set(ADMITURL=${HUB}/gateway/admit?dir=in&number=${NUM})
 same => n,Set(ADMIT=${CURL(${ADMITURL})})
 same => n,Set(GW_OK=${CUT(ADMIT,:,1)})
 same => n,Set(GW_UUID=${FILTER(0-9a-fA-F-,${CUT(ADMIT,:,2)})})
 same => n,GotoIf($["${GW_OK}" != "yes"]?busy)
 same => n,GotoIf($[${LEN(${GW_UUID})} < 32]?busy)
 same => n,Answer()
 same => n,Set(CHANNEL(audioreadformat)=slin)
 same => n,Set(CHANNEL(audiowriteformat)=slin)
 same => n,AudioSocket(${GW_UUID},${ASOCK})
 same => n,Hangup()
 same => n(busy),Hangup(17)

exten => sms,1,NoOp(gsm sms from ${CALLERID(num)} id ${UNIQUEID})
 same => n,UserEvent(GsmSms,From: ${CALLERID(num)},Body64: ${SMS_BASE64},ClientId: sms-${UNIQUEID})
 same => n,System(/usr/local/sbin/gsm-gateway-sms --client-id "sms-${UNIQUEID}" --from "${CALLERID(num)}" --body64 "${SMS_BASE64}")
 same => n,Hangup()

exten => ussd,1,NoOp(gsm ussd ignored)
 same => n,Hangup()

[gateway-media]
; Outbound originate lands here after the called party answers.
exten => s,1,NoOp(gsm ${GW_DIR} ${GW_NUMBER} ${GW_UUID})
 same => n,Set(CHANNEL(audioreadformat)=slin)
 same => n,Set(CHANNEL(audiowriteformat)=slin)
 same => n,AudioSocket(${GW_UUID},${ENV(GSM_GATEWAY_AUDIOSOCKET)})
 same => n,Hangup()
