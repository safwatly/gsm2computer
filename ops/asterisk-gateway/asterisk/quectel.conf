; gsm2computer-managed
; Quectel EC25-E voice over USB audio (UAC). Do not set audio= while quec_uac=1.
; The install script rewrites data= and alsadev= when it can see the modem.

[general]
interval=15
smsdb=/var/lib/asterisk/smsdb
csmsttl=600

[defaults]
context=gateway-in
group=1
rxgain=0
txgain=0
autodeletesms=yes
; ATZ on init can drop the UAC session the boot script just armed.
resetquectel=no
u2diag=-1
usecallingpres=yes
callingpres=allowed_passed_screen
disablesms=no
language=en
mindtmfgap=45
mindtmfduration=80
mindtmfinterval=200
; A second GSM call must reach the dialplan so it can Hangup(17).
; callwaiting=no only ignores the waiting leg, which leaves the caller ringing
; and never gives the hub a chance to refuse it. The hub still refuses to
; bridge it, and that refusal does not hang up the live call.
callwaiting=yes
disable=no
initstate=start
; Leave the PCM stream alone. DTMF detection rewrites samples.
dtmf=off

[ec25]
data=/dev/ttyUSB2
quec_uac=1
alsadev=hw:CARD=Android,DEV=0
