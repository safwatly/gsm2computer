# Shape of cup's /etc/nftables.conf. This is not a byte copy of the host file.
# `flush ruleset` lives here, in the host file, and wipes every table on load.
# A second inet table cannot open TCP 443: the host filter still drops it,
# and that second table would also drop UDP 41642 (the portal Tailscale).
# The gsm2computer drop-in is included at the end and only inserts TCP 443
# on the public NIC.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		iifname "lo" accept
		iifname "tailscale0" tcp dport { 21118, 21125-21129, 8787, 8449 } accept comment "rustdesk-and-hub-tailscale"
		iifname "tailscale0" udp dport { 21118, 21125-21129 } accept comment "rustdesk-tailscale"
		tcp dport 22 accept comment "ssh"
		udp dport 41641 accept comment "tailscale"
		udp dport 41642 accept comment "tailscale-portal"
		ip protocol icmp accept comment "icmp"
		meta l4proto icmpv6 accept comment "icmpv6"
	}
}

# BEGIN gsm2computer-public-entrance
# include "/etc/nftables.d/gsm2computer-public.nft"
# END gsm2computer-public-entrance
