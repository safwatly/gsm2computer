# Break-glass SSH on cup. Install as /etc/ssh/sshd_config.d/99-gsm2computer-key-only.conf
# then `sshd -t && systemctl reload ssh`. Reload keeps the current session.
# Rollback: delete this file and reload ssh again.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes
